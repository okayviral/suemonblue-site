<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>suemonblue</title>
<meta name="description" content="suemonblue">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Nunito+Sans:opsz,wght@6..12,300..900&display=swap" rel="stylesheet">
<style>
  :root { --pink:#FFF1F6; --red:#C40024; --blue:#4D5DFB; --muted:#8a4a58; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:"Nunito Sans","Avenir Next",sans-serif;
    background:var(--pink);
    display:flex; flex-direction:column; min-height:100dvh;
  }

  nav {
    padding:26px 24px;
    display:flex; justify-content:center; gap:28px;
  }
  nav a {
    font-size:13px; font-weight:800; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--red); text-decoration:none;
    padding-bottom:3px; border-bottom:2px solid transparent;
    transition:border-color .15s;
  }
  nav a:hover { border-bottom-color:var(--red); }

  main {
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:24px 24px 80px;
  }
  .logo {
    font-family:"Bodoni Moda",Georgia,serif; font-style:italic;
    color:var(--blue); line-height:1;
    font-size:clamp(44px, 13vw, 92px);
    display:flex; align-items:baseline; justify-content:center;
  }
  .logo .b1 { font-weight:400; }
  .logo .b2 { font-weight:900; letter-spacing:-1px; }

  footer { padding:0 0 0; }
  .foot-links {
    display:flex; justify-content:center; gap:18px;
    font-size:11.5px; color:var(--muted); padding:0 24px 18px;
  }
  .foot-links a { color:var(--muted); }
  .deco {
    height:16px;
    background:radial-gradient(circle at 12px 0, var(--red) 9px, transparent 10px);
    background-size:28px 16px; background-position:bottom;
  }
</style>
</head>
<body>

<nav>
  <a href="/50">50 red flags</a>
</nav>

<main>
  <div class="logo"><span class="b1">sue</span><span class="b2">monblue</span></div>
</main>

<footer>
  <div class="foot-links">
    <a href="https://instagram.com/suemonblue" target="_blank" rel="noopener">@suemonblue</a>
    <a href="/gizlilik.html">Gizlilik</a>
  </div>
  <div class="deco"></div>
</footer>

</body>
</html>
